<!doctype html><html><head><style>
body{font:16px/1.5 Arial;background:#fff;color:#111;margin:0;padding:20px}
button{font:16px Arial;border:0;padding:10px 16px;background:#1d4ed8;color:#fff;border-radius:6px;margin:4px}
button:focus-visible{outline:2px solid #111;outline-offset:2px}
.f:hover{filter:brightness(1.1)}
.o:hover{opacity:.85}
.t:hover{transform:translateY(-2px);box-shadow:0 4px 8px rgba(0,0,0,.2)}
.s:hover{transform:scale(1.03)}
.bl:hover{backdrop-filter:blur(4px)}
a.nolink{display:inline-block;padding:8px}
.glass{background:rgba(255,255,255,.7);color:#111}
.hero{background:#222 url(data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScxMCcgaGVpZ2h0PScxMCc+PHJlY3Qgd2lkdGg9JzEwJyBoZWlnaHQ9JzEwJyBmaWxsPScjMzMzJy8+PC9zdmc+);padding:20px}
.hero a{color:#fff}.hero a:hover{text-decoration:underline}
</style></head><body>
<h1>Hover kinds</h1>
<button class="f">filter</button><button class="o">opacity</button><button class="t">lift+shadow</button><button class="s">scale</button><button class="bl">backdrop</button>
<div class="hero"><a href="#h">link over bg image</a></div>
<p><a href="#plain">plain unstyled link</a></p>
</body></html>
