<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>账户设置</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1440px; height: 900px; overflow: hidden; background: #F3F4F1; color: #121417; font: 400 16px/1.6 "Noto Sans SC", sans-serif; }
  .serif { font-family: "Noto Serif SC", serif; }
  .wrap { display: grid; grid-template-columns: 240px 640px; gap: 64px; padding: 32px; height: 836px; }
  .name { font-size: 20px; font-weight: 700; margin-bottom: 24px; }
  nav a { display: flex; align-items: center; height: 40px; padding-left: 16px; font-size: 14px; font-weight: 500; color: #565C61; text-decoration: none; border-left: 2px solid #CDD2D0; }
  nav a[aria-current] { color: #121417; border-left-color: #0B6E4F; }
  h1 { font-size: 40px; line-height: 1.2; font-weight: 700; margin-bottom: 20px; }
  label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 4px; }
  input[type="text"], input[type="email"] { display: block; width: 100%; height: 40px; padding: 0 12px; font: 400 16px/1.6 "Noto Sans SC", sans-serif; color: #121417; background: #FFFFFF; border: 1px solid #CDD2D0; }
  input[aria-invalid="true"] { border-color: #B42318; }
  .help, .error { font-size: 13px; line-height: 1.5; margin: 4px 0 16px; }
  .help { color: #565C61; }
  .error { color: #B42318; }
  .switch { display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 12px 0; border-top: 1px solid #CDD2D0; }
  .switch input { width: 32px; height: 32px; accent-color: #0B6E4F; }
  .switch label { margin: 0; font-size: 16px; font-weight: 400; }
  .switch .state { margin-left: auto; font-size: 14px; font-weight: 500; color: #0B6E4F; }
  .danger { padding: 16px 0; border-top: 1px solid #CDD2D0; }
  h2 { font-size: 20px; line-height: 1.4; font-weight: 700; }
  .danger p { font-size: 14px; color: #565C61; margin: 4px 0 12px; }
  button { height: 40px; min-width: 88px; padding: 0 20px; font: 500 14px/1.4 "Noto Sans SC", sans-serif; color: #121417; background: #FFFFFF; border: 1px solid #CDD2D0; }
  button.destructive { color: #B42318; border-color: #B42318; }
  button.main { color: #FFFFFF; background: #0B6E4F; border-color: #0B6E4F; }
  .bar { height: 64px; padding: 0 32px; display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-top: 1px solid #CDD2D0; }
  .bar span { margin-right: auto; font-size: 14px; font-weight: 500; }
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <div class="name serif">纸页</div>
    <a href="#profile" aria-current="page">个人资料</a>
    <a href="#subscription">订阅</a>
    <a href="#notifications">通知</a>
    <a href="#security">安全</a>
  </nav>
  <form id="profile">
    <h1 class="serif">账户设置</h1>
    <label for="name">显示名称</label>
    <input id="name" type="text" value="林见川" aria-describedby="name-help">
    <p class="help" id="name-help">读者会在评论里看到这个名字。</p>
    <label for="email">邮箱</label>
    <input id="email" type="email" value="jianchuan@example" aria-invalid="true" aria-describedby="email-error">
    <p class="error" id="email-error">邮箱格式不对，请补上 @ 后面的完整域名，例如 name@example.com。</p>
    <div class="switch" id="notifications">
      <input id="weekly" type="checkbox" checked>
      <label for="weekly">每周五收到新一期的邮件</label>
      <span class="state">已开启</span>
    </div>
    <div class="danger" id="security">
      <h2>删除账户</h2>
      <p>删除后订阅立即终止，已付费用不退还，阅读记录无法恢复。</p>
      <button type="button" class="destructive">删除账户…</button>
    </div>
    <div id="subscription"></div>
  </form>
</div>
<div class="bar">
  <span>有未保存的修改</span>
  <button type="button">放弃修改</button>
  <button type="button" class="main">保存</button>
</div>
</body>
</html>
