<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stress fixture: fragile</title>
<link rel="icon" href="data:,">
<style>
/* Passes the normal audit with its mock-up copy. Under the stress pass it breaks five ways:
   a fixed-width name that hides its overflow, an ellipsis and (at 390px) a line clamp with no way
   back to the full value, a fixed-width button label, and a table whose unbroken cell pushes the
   page sideways. */
@font-face { font-family: "Inter"; src: url("fonts/Inter-var.woff") format("woff"); font-weight: 100 900; font-display: block; }
html { background: #fff; color: #18181b; font: 16px/1.5 Inter, sans-serif; }
body { margin: 0; padding: 24px 16px; }
main { max-width: 640px; margin: 0 auto; }
h1 { margin: 0 0 16px; font-size: 32px; line-height: 1.25; }
ul { list-style: none; margin: 0 0 24px; padding: 0; }
.person { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
.avatar { flex: none; width: 32px; height: 32px; border-radius: 16px; background: #e4e4e7; text-align: center; line-height: 32px; font-size: 12px; }
.name { width: 140px; white-space: nowrap; overflow: hidden; }
.role { width: 110px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #3f3f46; }
.note { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin: 0 0 24px; }
a { color: #1d4ed8; }
table { border-collapse: collapse; margin: 0 0 24px; }
th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid #d4d4d8; }
td.total { text-align: right; font-variant-numeric: tabular-nums; }
.save { width: 96px; height: 40px; border: 0; border-radius: 8px; background: #1d4ed8; color: #fff; font: inherit; white-space: nowrap; overflow: hidden; }
</style>
</head>
<body>
<main>
  <h1>Team</h1>
  <ul class="people">
    <li class="person"><span class="avatar" aria-hidden="true">AL</span><span class="name">Ada Lovelace</span><span class="role">Engineer</span></li>
    <li class="person"><span class="avatar" aria-hidden="true">GH</span><span class="name">Grace Hopper</span><span class="role">Admiral</span></li>
  </ul>
  <p class="note">Delivery note: the courier arrives on Monday morning.</p>
  <table class="orders" id="orders">
    <thead><tr><th>Order</th><th>Customer</th><th>Total</th></tr></thead>
    <tbody><tr><td>Open</td><td>Alan Turing</td><td class="total">$120</td></tr></tbody>
  </table>
  <button class="save" type="button">Save</button>
</main>
</body>
</html>
