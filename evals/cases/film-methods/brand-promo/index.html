<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Design Pipeline · 真实组件示例</title>
  <script src="lib/gsap.min.js"></script>
  <script src="lib/cinetic-motion-source.js"></script>
  <script src="lib/film-motion.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: oklch(0.975 0.008 160); color: oklch(0.25 0.015 160); font-family: "Microsoft YaHei", system-ui, sans-serif; }
    #root { width: 1920px; height: 1080px; position: relative; }
    header { position: absolute; left: 96px; top: 220px; width: 650px; }
    .brand { color: oklch(0.43 0.075 165); font-size: 28px; }
    h1 { font-size: 64px; line-height: 1.35; margin: 28px 0; }
    p { font-size: 28px; line-height: 1.65; margin: 0; }
    #camera { position: absolute; left: 850px; top: 90px; width: 1000px; height: 900px; transform-origin: center; }
    video { width: 1000px; height: 900px; display: block; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
    <header><p class="brand">Design Pipeline / 真实组件示例</p><h1>填写。选择。保存。</h1><p>同一个表单，保留原来的品牌与反馈。</p></header>
    <div id="camera"><video id="profile" src="assets/source.mp4" data-start="0" data-duration="6" data-track-index="0" muted playsinline></video></div>
  </div>
  <script>
    const M = FilmMotion.create({ fps: 30, bpm: 120 });
    const tl = gsap.timeline({ paused: true });
    tl.to('#camera', { x: -24, y: -12, scale: 1.035, duration: M.sec(M.b(1, 6)), ease: M.E.ui }, 0);
    tl.to('#camera', { x: 0, y: 0, scale: 1, duration: M.sec(M.b(1, 6)), ease: M.E.ui }, 3);
    window.__timelines = window.__timelines || {};
    window.__timelines.main = tl;
    tl.seek(0);
  </script>
</body>
</html>
