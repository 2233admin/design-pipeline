<!-- @dsCard group="订单流" height=130 subtitle="回放控制条：时间轴、倍速、跳到事件；回放时钟与实时明确分离" -->
<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Doto:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:12px;background:var(--bg-300);color:var(--ink-100);font-family:var(--font-mono);font-size:11px;font-variant-numeric:tabular-nums}
.bar{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;background:var(--bg-300);border:1px solid var(--signal-orange-dim);box-shadow:var(--plate);width:560px;box-sizing:border-box}
.btn{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;background:var(--bg-200);border:1px solid var(--line-100);color:var(--ink-200);border-radius:var(--radius-sm)}
.btn.on{border-color:var(--signal-orange-dim);color:var(--signal-orange);background:#2a1a0f}
.lcd{background:var(--bg-000);border:var(--hairline);box-shadow:var(--recess);padding:3px 8px;letter-spacing:.1em;display:flex;flex-direction:column;gap:0}
.lcd small{font-family:var(--font-dot);font-size:8px;letter-spacing:.12em;color:var(--ink-300)}
.lcd b{font-weight:500;font-size:13px;color:var(--signal-amber)}
.tl{flex:1;height:10px;background:var(--bg-000);border:var(--hairline);box-shadow:var(--recess);position:relative}
.tl i{position:absolute;top:0;bottom:0;left:0;width:38%;background:repeating-linear-gradient(90deg,var(--signal-orange) 0 3px,transparent 3px 5px)}
.tl b{position:absolute;top:-3px;left:38%;width:2px;height:16px;background:var(--signal-orange);box-shadow:var(--glow-orange)}
.tl s{position:absolute;top:2px;width:4px;height:6px;background:var(--signal-amber);text-decoration:none}
.spd{display:flex;gap:2px}
.spd span{padding:2px 6px;border:1px solid var(--line-100);font-size:10px;color:var(--ink-300)}
.spd span.on{border-color:var(--signal-orange-dim);color:var(--signal-orange)}
.tag{font-family:var(--font-dot);font-size:9px;letter-spacing:.14em;color:var(--signal-amber);border:1px solid var(--signal-orange-dim);padding:2px 6px}
</style></head><body>
<div class="bar" role="toolbar" aria-label="回放控制">
  <span class="tag">REPLAY</span>
  <button class="btn" aria-label="后退 1 分钟"><svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><path d="M6 1 L0 6 L6 11z M12 1 L6 6 L12 11z"/></svg></button>
  <button class="btn on" aria-label="暂停"><svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><rect x="1" y="1" width="4" height="10"/><rect x="7" y="1" width="4" height="10"/></svg></button>
  <button class="btn" aria-label="前进 1 分钟"><svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><path d="M0 1 L6 6 L0 11z M6 1 L12 6 L6 11z"/></svg></button>
  <div class="lcd"><small>REPLAY CLOCK</small><b>10:42:18</b></div>
  <div class="tl" role="slider" aria-label="回放进度" aria-valuenow="38" aria-valuemin="0" aria-valuemax="100" tabindex="0"><i></i><b></b><s style="left:52%"></s><s style="left:71%"></s></div>
  <div class="spd"><span>1×</span><span class="on">4×</span><span>16×</span><span>64×</span></div>
  <div class="lcd"><small>LIVE</small><b style="color:var(--ink-300)">14:32:07</b></div>
</div>
</body></html>
