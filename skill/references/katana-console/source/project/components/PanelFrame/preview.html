<!-- @dsCard group="工作台" height=220 subtitle="面板外框：标题 · 当前对象 · 联动色标 · 工具条 · 最大化/关闭" -->
<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:12px;background:var(--bg-100);color:var(--ink-100);font-family:var(--font-sans)}
.plate{position:relative;background:var(--bg-300);border:var(--hairline);box-shadow:var(--plate);display:flex;flex-direction:column}
.rivet{position:absolute;width:5px;height:5px;border-radius:var(--radius-pill);background:var(--bg-000);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.head{display:flex;align-items:center;gap:var(--space-2);height:32px;padding:0 var(--space-3);border-bottom:var(--hairline)}
.link{width:8px;height:8px;border-radius:var(--radius-pill);background:var(--link-a);box-shadow:var(--glow-orange)}
.obj{font-family:var(--font-mono);font-size:11px;color:var(--ink-300);letter-spacing:.06em}
.btn{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:1px solid transparent;color:var(--ink-300);border-radius:var(--radius-sm);cursor:pointer}
.btn:hover{background:var(--bg-400);color:var(--ink-100)}
.btn:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.body{flex:1;padding:var(--space-2) var(--space-3);display:flex;flex-direction:column;gap:var(--space-1)}
.row{display:flex;justify-content:space-between;height:var(--row-tight);align-items:center;font-family:var(--font-mono);font-size:11px;border-bottom:var(--hairline)}
.row:last-child{border-bottom:0}
</style></head><body>
<section class="plate" style="width:420px;height:184px" aria-label="自选 面板">
  <span class="rivet" style="top:5px;left:5px"></span><span class="rivet" style="top:5px;right:5px"></span><span class="rivet" style="bottom:5px;left:5px"></span><span class="rivet" style="bottom:5px;right:5px"></span>
  <header class="head">
    <span class="link" role="img" aria-label="联动组 A"></span>
    <span class="label" style="font-family:var(--font-display);font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase">自选</span>
    <span class="obj">· 核心池 · 24</span>
    <span style="flex:1"></span>
    <button class="btn" aria-label="设置"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="2"/><path d="M7 1v2M7 11v2M1 7h2M11 7h2M2.8 2.8l1.4 1.4M9.8 9.8l1.4 1.4M2.8 11.2l1.4-1.4M9.8 4.2l1.4-1.4"/></svg></button>
    <button class="btn" aria-label="最大化"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 5V2h3M12 5V2H9M2 9v3h3M12 9v3H9"/></svg></button>
    <button class="btn" aria-label="关闭"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3l8 8M11 3l-8 8"/></svg></button>
  </header>
  <div class="body">
    <div class="row"><span style="color:var(--ink-100)">300750 宁德时代</span><span><span style="color:var(--ink-200)">246.80</span> <span style="color:var(--pnl-up)">+2.14%</span></span></div>
    <div class="row"><span style="color:var(--ink-100)">002475 立讯精密</span><span><span style="color:var(--ink-200)">41.26</span> <span style="color:var(--pnl-up)">+2.90%</span></span></div>
    <div class="row"><span style="color:var(--ink-100)">600519 贵州茅台</span><span><span style="color:var(--ink-200)">1,482.00</span> <span style="color:var(--pnl-down)">-0.60%</span></span></div>
    <div class="row"><span style="color:var(--ink-100)">300308 中际旭创</span><span><span style="color:var(--ink-200)">188.40</span> <span style="color:var(--pnl-up)">+4.10%</span></span></div>
  </div>
</section>
</body></html>
