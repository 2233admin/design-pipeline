<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Doto:wght@500&family=Noto+Sans+SC:wght@400&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:12px;background:var(--bg-300);color:var(--ink-100);font-family:var(--font-mono);font-size:11px;font-variant-numeric:tabular-nums}
.tag{font-family:var(--font-dot);font-size:9px;letter-spacing:.08em;color:var(--ink-300);-webkit-font-smoothing:none}
.cn{font-family:var(--font-sans)}
.r{text-align:right}
.hd{background:var(--bg-300);color:var(--ink-300);font-size:10px;letter-spacing:.06em}
.grid{border:var(--hairline);background:var(--bg-200)}
.foot{display:flex;gap:16px;padding:6px 10px;color:var(--ink-300);font-size:10px;letter-spacing:.06em;border-top:var(--hairline);background:var(--bg-300)}
.foot b{font-weight:400;color:var(--ink-100)}
.seg{display:flex;background:var(--bg-000);box-shadow:var(--recess);padding:2px}
.seg span{padding:3px 8px;color:var(--ink-300);font-size:10px}.seg span.on{background:var(--bg-400);color:var(--signal-orange)}
.lcd{font-family:var(--font-lcd);letter-spacing:.08em}
.top{display:flex;gap:8px;align-items:center;margin-bottom:8px;font-size:10px;color:var(--ink-300)}
.run{color:var(--signal-blue)}
.led{width:6px;height:6px;border-radius:var(--radius-pill);display:inline-block}
.ok{background:var(--signal-green)}.warn{background:var(--signal-amber)}.off{background:var(--led-off);box-shadow:inset 0 1px 1px rgba(0,0,0,.6)}.on{background:var(--signal-orange);box-shadow:var(--glow-orange)}.bad{background:var(--signal-red)}
.gates{display:inline-flex;gap:3px}
svg text{font-family:var(--font-mono);font-size:9px;fill:var(--chart-axis)}
.gl{stroke:var(--chart-grid)}
.wrap{display:grid;grid-template-columns:380px 232px;gap:8px;width:620px}
.box{background:var(--bg-200);border:var(--hairline);padding:8px 10px}
.kv{display:grid;grid-template-columns:70px 1fr;gap:4px 8px;font-size:10px}
.kv span{color:var(--ink-300)}.kv b{font-weight:400;color:var(--ink-100)}
.kv b.w{color:var(--signal-amber)}
</style></head><body>
<div class="top"><span class="run">RUN 2e51</span><span>optimize · MOM_RS_V3 · 240 组 · Optuna TPE</span><div class="seg"><span class="on">lookback</span><span>top%</span><span>lookback × top%</span></div><span style="margin-left:auto">目标 样本外 Sharpe</span></div>
<div class="wrap">
  <div class="box"><svg width="360" height="190" viewBox="0 0 360 190" role="img" aria-label="lookback 敏感性">
    <rect x="130" y="10" width="120" height="160" fill="var(--signal-orange-dim)" opacity=".35"/>
    <g class="gl"><line x1="30" y1="40" x2="350" y2="40"/><line x1="30" y1="90" x2="350" y2="90"/><line x1="30" y1="140" x2="350" y2="140"/><line x1="30" y1="170" x2="350" y2="170"/></g>
    <text x="24" y="43" text-anchor="end">1.2</text><text x="24" y="93" text-anchor="end">0.8</text><text x="24" y="143" text-anchor="end">0.4</text>
    <text x="30" y="184">5</text><text x="130" y="184">15</text><text x="250" y="184">27</text><text x="340" y="184">40</text>
    <g>
      <circle cx="40" cy="150" r="3" fill="var(--seq-200)"/><circle cx="55" cy="138" r="3" fill="var(--seq-200)"/><circle cx="70" cy="120" r="3" fill="var(--seq-300)"/><circle cx="85" cy="112" r="3" fill="var(--seq-300)"/><circle cx="100" cy="96" r="3" fill="var(--seq-400)"/><circle cx="115" cy="84" r="3" fill="var(--seq-400)"/>
      <circle cx="135" cy="66" r="3" fill="var(--seq-500)"/><circle cx="150" cy="60" r="3" fill="var(--seq-500)"/><circle cx="165" cy="58" r="3" fill="var(--seq-600)"/><circle cx="180" cy="52" r="3" fill="var(--seq-600)"/><circle cx="195" cy="56" r="3" fill="var(--seq-600)"/><circle cx="210" cy="62" r="3" fill="var(--seq-500)"/><circle cx="225" cy="64" r="3" fill="var(--seq-500)"/><circle cx="240" cy="70" r="3" fill="var(--seq-500)"/>
      <circle cx="260" cy="86" r="3" fill="var(--seq-400)"/><circle cx="280" cy="100" r="3" fill="var(--seq-300)"/><circle cx="300" cy="118" r="3" fill="var(--seq-300)"/><circle cx="320" cy="130" r="3" fill="var(--seq-200)"/><circle cx="340" cy="146" r="3" fill="var(--seq-200)"/>
      <circle cx="160" cy="44" r="3" fill="var(--seq-600)"/><circle cx="188" cy="48" r="3" fill="var(--seq-600)"/><circle cx="92" cy="130" r="3" fill="var(--seq-200)"/><circle cx="230" cy="80" r="3" fill="var(--seq-400)"/>
    </g>
    <circle cx="180" cy="52" r="6" fill="none" stroke="var(--signal-orange)" stroke-width="1.5" style="filter:drop-shadow(0 0 4px #ff6a1f)"/>
    <text x="190" y="46" fill="var(--signal-orange)">最优 20 · 1.12</text>
    <text x="134" y="22" fill="var(--ink-300)">平坦区 15–27 · 跌幅 ≤ 15%</text>
  </svg></div>
  <div class="box"><div class="kv"><span>最优</span><b>lookback 20 · top 10% · 1.12</b><span>平坦区</span><b>15 – 27（13 格）</b><span>平坦度</span><b>区内均值 1.01 · σ 0.06</b><span>边缘</span><b class="w">5 与 40 处 &lt; 0.5</b><span>当前 run</span><b>lookback 20 → 在平坦区中部</b><span>建议</span><b style="color:var(--ink-300)">取平坦区中点，不取最优 · 见 RUN 评估</b><span>组数</span><b>240 · 完成 240</b></div></div>
</div>
</body></html>
