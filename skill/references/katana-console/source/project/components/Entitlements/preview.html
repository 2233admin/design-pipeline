<!-- @dsCard group="运行中心" height=240 subtitle="Entitlements：许可与权限——按角色 / 计划 / 数据源的功能门控与配额（指标数、连接数、历史天数、资产数），部署者可配；对应 ATAS tier gating，也是机构级 RBAC 的落点" -->
<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Doto:wght@500&family=Barlow+Condensed:wght@800&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:12px;background:var(--bg-300);color:var(--ink-100);font-family:var(--font-mono);font-size:11px;font-variant-numeric:tabular-nums}
.tag{font-family:var(--font-dot);font-size:9px;letter-spacing:.08em;color:var(--ink-300);-webkit-font-smoothing:none}
.acc{font-family:var(--font-dot);font-size:12px;color:var(--signal-orange);-webkit-font-smoothing:none}
.cn{font-family:var(--font-sans)}.code{color:var(--ink-200)}
.up{color:var(--pnl-up)}.dn{color:var(--pnl-down)}.est{color:var(--signal-amber)}
.r{text-align:right}
.hd{background:var(--bg-300);color:var(--ink-300);font-size:10px;letter-spacing:.06em}
.grid{border:var(--hairline);background:var(--bg-200);width:620px}
.row>div{padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot{display:flex;gap:16px;padding:6px 10px;color:var(--ink-300);font-size:10px;letter-spacing:.06em;border-top:var(--hairline);background:var(--bg-300)}
.foot b{font-weight:400;color:var(--ink-100)}
.seg{display:flex;background:var(--bg-000);box-shadow:var(--recess);padding:2px}
.seg span{padding:3px 8px;color:var(--ink-300);font-size:10px}.seg span.on{background:var(--bg-400);color:var(--signal-orange)}
.lcd{font-family:var(--font-lcd);letter-spacing:.08em}
.top{display:flex;gap:8px;align-items:center;margin-bottom:8px;font-size:10px;color:var(--ink-300)}
.run{color:var(--signal-blue)}
.led{width:6px;height:6px;border-radius:var(--radius-pill);display:inline-block}
.ok{background:var(--signal-green)}.warn{background:var(--signal-amber)}.off{background:var(--led-off);box-shadow:inset 0 1px 1px rgba(0,0,0,.6)}.on{background:var(--signal-orange);box-shadow:var(--glow-orange)}.bad{background:var(--signal-red)}
svg text{font-family:var(--font-mono);font-size:9px;fill:var(--chart-axis)}
.gl{stroke:var(--chart-grid)}
.kpi{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:620px;margin-bottom:8px}
.kpi div{background:var(--bg-000);box-shadow:var(--recess);padding:6px 8px}
.kpi small{display:block;font-family:var(--font-dot);font-size:9px;letter-spacing:.1em;color:var(--ink-300);-webkit-font-smoothing:none}
.kpi b{font-weight:500;font-family:var(--font-lcd);font-size:15px;letter-spacing:.06em;color:var(--ink-100)}
.kpi i{display:block;font-style:normal;font-size:10px;color:var(--ink-300)}
.ax{position:relative;height:10px}
.ax:before{content:"";position:absolute;left:var(--z,50%);top:-4px;bottom:-4px;width:1px;background:var(--line-200)}
.ax i{position:absolute;top:2px;height:6px;background:repeating-linear-gradient(90deg,var(--ink-200) 0 3px,transparent 3px 5px)}
.ax i.w{background:repeating-linear-gradient(90deg,var(--signal-amber) 0 3px,transparent 3px 5px)}
.bar{height:6px;background:var(--bg-000);border:1px solid var(--line-100)}
.bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--series-1) 0 3px,transparent 3px 5px)}
.box{background:var(--bg-200);border:var(--hairline);padding:8px 10px}
.box h4{margin:0 0 6px;font:inherit;font-size:9px;letter-spacing:.1em;color:var(--ink-300);font-family:var(--font-dot);-webkit-font-smoothing:none}
.ly{font-family:var(--font-dot);font-size:9px;letter-spacing:.08em;-webkit-font-smoothing:none;border:1px solid var(--line-200);padding:0 4px;color:var(--ink-300)}
.ly.hypo{color:var(--signal-blue);border-color:var(--signal-blue)}.ly.fcst{border-style:dashed}.ly.plan{background:transparent;color:var(--ink-200)}.ly.fact{color:var(--ink-100);border-color:var(--ink-300)}


.en{display:grid;grid-template-columns:150px 1fr;gap:8px;width:620px;height:190px}
.pl{background:var(--bg-200);border:var(--hairline)}
.pl h4{margin:0;padding:5px 8px;font:inherit;font-size:9px;letter-spacing:.1em;color:var(--ink-300);font-family:var(--font-dot);-webkit-font-smoothing:none;border-bottom:var(--hairline)}
.pl div{padding:4px 8px;color:var(--ink-200);display:flex;justify-content:space-between}.pl div.on{background:var(--bg-400);color:var(--ink-100)}.pl small{color:var(--ink-300)}
.mx{background:var(--bg-200);border:var(--hairline)}
.mx .row{display:grid;grid-template-columns:1fr 70px 70px 70px 90px;padding:3px 8px;color:var(--ink-200);align-items:center}.mx .row.hd{color:var(--ink-300);font-size:9px;letter-spacing:.06em;border-bottom:var(--hairline)}
.mx .row span:nth-child(n+2){text-align:center}
.q{font-family:var(--font-lcd);letter-spacing:.06em;color:var(--ink-100)}
.src{font-family:var(--font-dot);font-size:9px;letter-spacing:.06em;-webkit-font-smoothing:none;border:1px solid var(--line-200);padding:0 3px;color:var(--ink-300)}

</style></head><body>

<div class="top"><span class="cn" style="font-weight:700;font-size:13px;color:var(--ink-100)">许可与权限 · 部署：self-hosted</span><span class="tag">ROLES 4 · PLANS 3</span><span class="seg" style="margin-left:auto"><span class="on">功能</span><span>配额</span><span>数据源</span><span>审计</span></span></div>
<div class="en">
 <div class="pl"><h4>计划 / 角色</h4><div class="on">Open（默认） <small>∞</small></div><div>Desk <small>团队</small></div><div>Risk <small>只读交易</small></div><div>Guest <small>只读</small></div><div style="margin-top:6px;color:var(--ink-300);font-size:10px;display:block">GPL 自部署默认全开；托管部署由部署者配</div></div>
 <div class="mx"><div class="row hd"><span>能力 / 配额</span><span>Open</span><span>Desk</span><span>Guest</span><span>来源</span></div>
  <div class="row"><span>每图指标数</span><span class="q">∞</span><span class="q">∞</span><span class="q">6</span><span><span class="src">PLAN</span></span></div>
  <div class="row"><span>活跃连接数</span><span class="q">∞</span><span class="q">3</span><span class="q">1</span><span><span class="src">PLAN</span></span></div>
  <div class="row"><span>Heatmap 历史天数</span><span class="q">30</span><span class="q">30</span><span class="q">2</span><span><span class="src">DATA</span> L2 录制</span></div>
  <div class="row"><span>MBO / L3</span><span class="q">开</span><span class="q">开</span><span class="q">—</span><span><span class="src">DATA</span> Rithmic</span></div>
  <div class="row"><span>实盘下单</span><span class="q">开</span><span class="q">开</span><span class="q">关</span><span><span class="src">ROLE</span></span></div>
  <div class="row"><span>限额写入 limit.set</span><span class="q">开</span><span class="q">审批</span><span class="q">关</span><span><span class="src">ROLE</span> 四眼</span></div>
 </div>
</div>

</body></html>
