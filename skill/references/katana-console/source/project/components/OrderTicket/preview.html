<!-- @dsCard group="交易" height=330 subtitle="OrderTicket：下单票（核心界面，不可皮肤化）；账户第一行、方向订单流色、数量步进、预估占用、风控预检灯，提交→确认框" -->
<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Doto:wght@500&family=Noto+Sans+SC:wght@400&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:12px;background:var(--bg-300);color:var(--ink-100);font-family:var(--font-mono);font-size:11px;font-variant-numeric:tabular-nums}
.tk{width:300px;background:var(--bg-200);border:var(--hairline);box-shadow:var(--plate)}
.hd{height:28px;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--bg-300);border-bottom:var(--hairline)}
.acc{font-family:var(--font-dot);font-size:14px;color:var(--signal-orange);-webkit-font-smoothing:none}
.kind{font-family:var(--font-dot);font-size:9px;letter-spacing:.08em;color:var(--signal-amber);-webkit-font-smoothing:none}
.hd .sym{margin-left:auto;color:var(--ink-200)}.cn{font-family:var(--font-sans)}
.body{padding:10px;display:grid;gap:8px}
.side{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--bg-000);box-shadow:var(--recess);padding:2px}
.side span{height:28px;display:flex;align-items:center;justify-content:center;font-family:var(--font-dot);font-size:12px;letter-spacing:.1em;-webkit-font-smoothing:none;color:var(--ink-300)}
.side .buy.on{background:var(--bid-100);color:var(--bid);box-shadow:inset 0 0 0 1px var(--bid-200)}
.side .sell{color:var(--ink-300)}
.f{display:grid;grid-template-columns:56px 1fr;align-items:center;gap:8px}
.lab{font-family:var(--font-dot);font-size:9px;letter-spacing:.08em;color:var(--ink-300);-webkit-font-smoothing:none}
.in{height:28px;background:var(--bg-000);box-shadow:var(--recess);display:flex;align-items:center;padding:0 8px;gap:8px;font-family:var(--font-lcd);font-size:14px;letter-spacing:.06em}
.in small{font-size:9px;color:var(--ink-300);font-family:var(--font-dot);letter-spacing:.08em;-webkit-font-smoothing:none;margin-left:auto}
.step{display:flex;gap:2px;margin-left:auto}
.step b{width:28px;height:22px;display:flex;align-items:center;justify-content:center;background:var(--bg-400);color:var(--ink-200);font-weight:400;font-size:12px}
.seg{display:flex;background:var(--bg-000);box-shadow:var(--recess);padding:2px}
.seg span{flex:1;text-align:center;padding:4px 0;color:var(--ink-300);font-size:10px}.seg span.on{background:var(--bg-400);color:var(--signal-orange)}
.pre{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;padding:8px;background:var(--bg-000);box-shadow:var(--recess);font-size:10px;color:var(--ink-300)}
.pre b{font-weight:400;color:var(--ink-100);text-align:right}
.chk{display:flex;gap:10px;align-items:center;font-size:10px;color:var(--ink-300);letter-spacing:.06em}
.led{width:8px;height:8px;border-radius:var(--radius-pill);display:inline-block;margin-right:4px}
.ok{background:var(--signal-green);box-shadow:var(--glow-orange)}.warn{background:var(--signal-amber)}
.btn{height:32px;display:flex;align-items:center;justify-content:center;background:var(--bg-400);border:1px solid var(--line-200);color:var(--ink-100);font-size:12px;letter-spacing:.06em}
.btn small{font-family:var(--font-dot);font-size:9px;color:var(--ink-300);margin-left:8px;-webkit-font-smoothing:none}
</style></head><body>
<div class="tk" role="form" aria-label="下单 · 账户 A 实盘">
  <div class="hd"><span class="acc">A</span><span class="kind">LIVE · 实盘</span><span class="sym"><span style="color:var(--ink-200)">300750</span> <span class="cn">宁德时代</span></span></div>
  <div class="body">
    <div class="side"><span class="buy on">BUY 买入</span><span class="sell">SELL 卖出</span></div>
    <div class="f"><span class="lab">类型</span><div class="seg"><span class="on">限价</span><span>市价</span><span>对手价</span><span>算法</span></div></div>
    <div class="f"><span class="lab">价格</span><div class="in">245.50<small>买一 245.48</small></div></div>
    <div class="f"><span class="lab">数量</span><div class="in">2,000<div class="step"><b>−</b><b>+</b><b>¼</b><b>½</b><b>全</b></div></div></div>
    <div class="pre"><span>金额</span><b>491,000</b><span>可用</span><b>612,340</b><span>成交后权重</span><b>58% <span style="color:var(--signal-amber)">▲ 上限 60</span></b><span>费用（估）</span><b>147</b></div>
    <div class="chk"><span><span class="led ok"></span>风控预检</span><span><span class="led warn"></span>集中度接近</span><span style="margin-left:auto">hash 7f3a</span></div>
    <div class="btn">提交 → 确认<small>⌘⏎</small></div>
  </div>
</div>
</body></html>
