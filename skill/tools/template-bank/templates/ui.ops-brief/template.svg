top-opacity="1"/></linearGradient></defs><rect x="0.0" y="0.0" width="500.0" height="640.0" fill="#121A1E" data-role="slate"/><text data-slot="title" data-kind="text" data-max-chars="6" data-title="1" data-box="0.0,4.0,500.0,48.0" x="0.0" y="40.0" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-weight="700" font-size="36.0" fill="#E8ECEA" data-role="text" text-anchor="start" data-font-role="head">灰隼</text><text data-slot="name" data-kind="text" data-max-chars="14" data-box="0.0,60.0,500.0,24.0" x="0.0" y="76.0" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-weight="400" font-size="16.0" fill="#17F29C" data-role="green" text-anchor="start" data-font-role="body">姓名：沈砚舟</text><rect data-deco="1" x="0" y="104.0" width="500.0" height="1.0" fill="#5A6560"/><g data-deco="1" transform="translate(8.0 134.0) scale(2.0)" fill="none" stroke="#FF4057" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><path d="M4 18l8-13 8 13-8-4z"/></g><text data-slot="sub_1" data-kind="text" data-max-chars="10" data-box="72.0,114.0,428.0,32.0" x="72.0" y="140.0" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-weight="700" font-size="23.0" fill="#FF4057" data-role="red" text-anchor="start" data-font-role="head">定位：突击</text><text data-slot="body_1" data-kind="text" data-max-chars="40" data-lines="2" data-box="72.0,150.0,428.0,48.0" x="72.0" y="166.0" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-weight="400" font-size="16.0" fill="#E8ECEA" data-role="text" text-anchor="start" data-font-role="body"><tspan x="72.0" dy="0">突击干员拥有更快的冲刺与换弹速度，可携带破片榴弹与震</tspan><tspan x="72.0" dy="24.0">撼弹。</tspan></text><rect data-deco="1" x="0" y="216.0" width="500.0" height="1.0" fill="#5A6560"/><g data-deco="1" transform="translate(8.0 246.0) scale(1.7)" fill="none" stroke="#E8ECEA" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><path d="M3 16h7M5 12h7M3 8h7"/><path d="M13 6l7 6-7 6z"/></g><text data-slot="sub_2" data-kind="text" data-max-chars="12" data-box="72.0,226.0,428.0,32.0" x="72.0" y="252.0" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-weight="700" font-size="23.0" fill="#17F29C" data-role="green" text-anchor="start" data-font-role="head">战术装备 - 推进护腿</text><text data-slot="body_2" data-kind="text" data-max-chars="40" data-lines="2" data-box="72.0,262.0,428.0,48.0" x="72.0" y="278.0" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-weight="400" font-size="16.0" fill="#E8ECEA" data-role="text" text-anchor="start" data-font-role="body">短时间内大幅提升冲刺速度，冲刺中开镜不受减速影响。</text><rect data-deco="1" x="0" y="328.0" width="500.0" height="1.0" fill="#5A6560"/><g data-deco="1" transform="translate(8.0 358.0) scale(1.7)" fill="none" stroke="#E8ECEA" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><rect x="5" y="11" width="14" height="7" rx="1"/><path d="M8 11V8h8v3M12 8V5"/></g><text data-slot="sub_3" data-kind="text" data-max-chars="12" data-box="72.0,338.0,428.0,32.0" x="72.0" y="364.0" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-weight="700" font-size="23.0" fill="#17F29C" data-role="green" text-anchor="start" data-font-role="head">战术道具 - 破门炸药</text><text data-slot="body_3" data-kind="text" data-max-chars="40" data-lines="2" data-box="72.0,374.0,428.0,48.0" x="72.0" y="390.0" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-weight="400" font-size="16.0" fill="#E8ECEA" data-role="text" text-anchor="start" data-font-role="body">贴附在门与薄墙上远程起爆，炸开一条新的进攻路线。</text><rect data-deco="1" x="0" y="440.0" width="500.0" height="1.0" fill="#5A6560"/><g data-deco="1" transform="translate(8.0 470.0) scale(1.7)" fill="none" stroke="#E8ECEA" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><circle cx="9" cy="14" r="4"/><circle cx="15" cy="12" r="5"/><path d="M5 20h14"/></g><text data-slot="sub_4" data-kind="text" data-max-chars="12" data-box="72.0,450.0,428.0,32.0" x="72.0" y="476.0" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-weight="700" font-size="23.0" fill="#17F29C" data-role="green" text-anchor="start" data-font-role="head">干员特长 - 疾行换弹</text><text data-slot="body_4" data-kind="text" data-max-chars="40" data-lines="2" data-box="72.0,486.0,428.0,48.0" x="72.0" y="502.0" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-weight="400" font-size="16.0" fill="#E8ECEA" data-role="text" text-anchor="start" data-font-role="body">移动中换弹速度提升，不会打断冲刺。</text><g id="guides" display="none"></g></svg>
