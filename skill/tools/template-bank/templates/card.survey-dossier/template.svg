.0,810.0,86.0,22.0" x="412.0" y="827.0" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-weight="500" font-size="16.0" fill="#1A1A1A" data-role="ink" text-anchor="middle" data-font-role="body">声线·中</text><text data-slot="value_3" data-kind="text" data-max-chars="8" data-box="459.0,810.0,161.0,22.0" x="539.5" y="827.0" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-weight="500" font-size="16.0" fill="#1A1A1A" data-role="ink" text-anchor="middle" data-font-role="body">方屿</text><rect x="652.0" y="809.0" width="90.0" height="24.0" fill="#FFEE00" data-role="yellow"/><rect x="742.0" y="809.0" width="165.0" height="24.0" fill="#F2F2F2" data-role="grey1"/><text data-slot="label_4" data-kind="text" data-max-chars="4" data-box="654.0,810.0,86.0,22.0" x="697.0" y="827.0" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-weight="500" font-size="16.0" fill="#1A1A1A" data-role="ink" text-anchor="middle" data-font-role="body">声线·日</text><text data-slot="value_4" data-kind="text" data-max-chars="8" data-box="744.0,810.0,161.0,22.0" x="824.5" y="827.0" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-weight="500" font-size="16.0" fill="#1A1A1A" data-role="ink" text-anchor="middle" data-font-role="body">高槻凛</text><text data-slot="quote" data-kind="text" data-max-chars="28" data-box="365.0,858.0,556.0,28.0" x="367.0" y="880.0" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-weight="500" font-size="19.0" fill="#1A1A1A" data-role="ink" text-anchor="start" data-font-role="body">“偏差零点三度，重测。这条线要走一百年。”</text><text data-slot="bio" data-kind="text" data-max-chars="90" data-lines="3" data-box="365.0,900.0,556.0,92.0" x="367.0" y="920.0" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-weight="500" font-size="17.0" fill="#1A1A1A" data-role="ink" text-anchor="start" data-font-role="body"><tspan x="367.0" dy="0">岑砚是第七导线队的测绘组长，也是缓行站上资历最老的现役队员。她习</tspan><tspan x="367.0" dy="27.5">惯在日出前把晷针插进冻土，用影子校准当天的第一条基线。</tspan></text><g id="guides" display="none"><rect x="357.0" y="150.0" width="600.0" height="860.0" fill="none" stroke="#00C080" stroke-width="2" stroke-dasharray="10 6"/><text x="363.0" y="168.0" font-family="monospace" font-size="14" fill="#00C080">info (keep listed slots inside)</text></g></svg>
