<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signal Board</title>
  <style>
    :root { color-scheme: dark; font: 16px system-ui, sans-serif; }
    body { margin: 0; background: #111827; color: #e5e7eb; }
    main { width: min(760px, calc(100vw - 32px)); margin: 48px auto; }
    .panel { border: 1px solid #334155; border-radius: 12px; padding: 24px; background: #1e293b; }
    canvas { display: block; width: 100%; height: 180px; margin-top: 20px; background: #0f172a; border-radius: 8px; }
    button { border: 1px solid #64748b; border-radius: 6px; padding: 8px 12px; background: #334155; color: inherit; }
  </style>
</head>
<body>
  <main>
    <section class="panel" id="signal-panel" aria-labelledby="signal-title">
      <h1 id="signal-title">Signal Board</h1>
      <p id="signal-copy">A compact operations snapshot with a DOM summary and a Canvas trend line.</p>
      <button id="refresh" type="button">Refresh trend</button>
      <canvas id="trend" width="720" height="180" aria-label="Seven point trend chart"></canvas>
    </section>
  </main>
  <script>
    const canvas = document.querySelector('#trend');
    const ctx = canvas.getContext('2d');
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 3;
    ctx.beginPath();
    [48, 72, 61, 104, 96, 132, 120].forEach((value, index) => {
      const x = 20 + index * 110;
      const y = 160 - value;
      index ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    });
    ctx.stroke();
    document.querySelector('#refresh').addEventListener('click', () => {
      document.querySelector('#signal-copy').textContent = 'Trend refreshed at the authored sample point.';
    });
  </script>
</body>
</html>
