name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install locked workspace dependencies
        run: npm ci

      - name: Prepare font-subset test runtime
        run: |
          python3 -m venv "$RUNNER_TEMP/design-pipeline-fonttools"
          "$RUNNER_TEMP/design-pipeline-fonttools/bin/python" -m pip install fonttools==4.66.1
          echo "FONTTOOLS_PYTHON=$RUNNER_TEMP/design-pipeline-fonttools/bin/python" >> "$GITHUB_ENV"

      - name: Prepare browser runtimes
        run: |
          npm exec -- playwright install-deps chromium
          npm run browser:install

      - name: Allow Chrome's sandbox
        # Same as ci.yml: Ubuntu 23.10+ runners restrict unprivileged user namespaces through AppArmor,
        # so the headless Chrome the browser tests launch exits with "No usable sandbox!".
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Resolve version
        id: ver
        run: |
          version="$(node -e 'process.stdout.write(require("node:fs").readFileSync("VERSION", "utf8").trim())')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate release contract
        run: |
          args=(--version "${{ steps.ver.outputs.version }}" --json)
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            args+=(--tag "$GITHUB_REF_NAME")
          fi
          node scripts/release-contract.cjs "${args[@]}"

      - name: Validate specifications
        run: npm run specs:check

      - name: QA
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/qa.log"
        env:
          PACKAGE_VERSION: ${{ steps.ver.outputs.version }}

      - name: Annotate QA failures
        # Same as ci.yml: a failure is readable from the run's annotations without the job log.
        if: failure()
        shell: bash
        run: |
          grep -E '^FAIL ' "$RUNNER_TEMP/qa.log" | head -20 | while IFS= read -r line; do echo "::error title=QA::$line"; done
          awk '/^[[:space:]]*not ok /{if(n>0) print block; block=$0; n=25; next} n>0{block=block "%0A" $0; n--; if(n==0){print block}} END{if(n>0) print block}' "$RUNNER_TEMP/qa.log" | head -10 | while IFS= read -r block; do echo "::error title=Failing test::$block"; done

      - name: Package
        run: npm run package:skill -- --output-root dist
        env:
          PACKAGE_VERSION: ${{ steps.ver.outputs.version }}
          RELEASE_MODE: "1"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: design-pipeline v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            dist/design-pipeline-skill.tgz
            dist/design-pipeline-skill.zip
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
