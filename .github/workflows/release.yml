name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Resolve version
        id: ver
        run: |
          version="$(node -e 'process.stdout.write(require("node:fs").readFileSync("VERSION", "utf8").trim())')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate release contract
        run: |
          args=(--version "${{ steps.ver.outputs.version }}" --json)
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            args+=(--tag "$GITHUB_REF_NAME")
          fi
          node scripts/release-contract.cjs "${args[@]}"

      - name: QA
        run: node scripts/qa.cjs
        env:
          PACKAGE_VERSION: ${{ steps.ver.outputs.version }}

      - name: Package
        run: node scripts/package.cjs --output-root dist
        env:
          PACKAGE_VERSION: ${{ steps.ver.outputs.version }}
          RELEASE_MODE: "1"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: design-pipeline v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            dist/design-pipeline-skill.tgz
            dist/design-pipeline-skill.zip
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
