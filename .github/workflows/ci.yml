name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  qa-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install locked workspace dependencies
        run: npm ci

      - name: Prepare browser runtimes
        run: |
          npm exec -- playwright install-deps chromium
          npm run browser:install

      - name: Validate specifications
        run: npm run specs:check

      - name: Hermetic QA
        run: npm test

      - name: Package
        run: npm run package:skill -- --output-root dist

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: design-pipeline-skill
          path: |
            dist/design-pipeline-skill.tgz
            dist/design-pipeline-skill.zip
            dist/checksums.txt
          if-no-files-found: error
