name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  qa-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install locked workspace dependencies
        run: npm ci

      - name: Prepare font-subset test runtime
        run: |
          python3 -m venv "$RUNNER_TEMP/design-pipeline-fonttools"
          "$RUNNER_TEMP/design-pipeline-fonttools/bin/python" -m pip install fonttools==4.66.1
          echo "HUASHU_PYTHON=$RUNNER_TEMP/design-pipeline-fonttools/bin/python" >> "$GITHUB_ENV"

      - name: Prepare browser runtimes
        run: |
          npm exec -- playwright install-deps chromium
          npm run browser:install

      - name: Allow Chrome's sandbox
        # Ubuntu 23.10+ runners restrict unprivileged user namespaces through AppArmor, so the headless
        # Chrome the browser tests launch exits with "No usable sandbox!". Lift that restriction here
        # instead of turning the sandbox off in the tests.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Validate specifications
        run: npm run specs:check

      - name: Hermetic QA
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/qa.log"

      - name: Report QA failures
        if: failure()
        shell: bash
        run: |
          awk '/^ *(not ok|FAIL) /{ if (name != "") print "::error title=QA::" name "%0A" msg; name=$0; msg=""; n=0; next }
               name != "" && n < 14 { gsub(/%/, "%25"); msg = msg "%0A" substr($0, 1, 300); n++ }
               END { if (name != "") print "::error title=QA::" name "%0A" msg }' "$RUNNER_TEMP/qa.log" | head -40

      - name: Package
        run: npm run package:skill -- --output-root dist

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: design-pipeline-skill
          path: |
            dist/design-pipeline-skill.tgz
            dist/design-pipeline-skill.zip
            dist/checksums.txt
          if-no-files-found: error
