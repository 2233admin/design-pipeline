name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  windows-path-regressions:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install locked workspace dependencies
        run: npm ci

      - name: Windows path identity and storyboard regressions
        shell: pwsh
        run: |
          node --test --test-reporter=tap --test-name-pattern="contained paths keep lexical coordinates|Windows public storyboard verification" tests/execution-target-routing.test.cjs tests/workflow-next.test.cjs | Tee-Object -Variable windowsResults
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = $windowsResults -join "`n"
          foreach ($marker in @("Windows alias identity assertions executed", "Windows storyboard uppercase path verified")) {
            if ($report -notmatch "(?m)^# $marker\r?$") { throw "Windows regression did not execute: $marker" }
          }

      - name: Installed browsers without the HyperFrames download
        # No `hyperframes browser ensure` here: the resolver must find the runner's own Chrome and
        # Edge, and both must launch through puppeteer-core.
        shell: pwsh
        run: |
          node --test --test-reporter=tap tests/browser-locate.test.cjs | Tee-Object -Variable browserResults
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = $browserResults -join "`n"
          foreach ($name in @("chrome", "edge")) {
            if ($report -notmatch "(?m)^# ${name}: ") { throw "Installed $name was not launched" }
          }

  qa-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install locked workspace dependencies
        run: npm ci

      - name: Prepare font-subset test runtime
        run: |
          python3 -m venv "$RUNNER_TEMP/design-pipeline-fonttools"
          "$RUNNER_TEMP/design-pipeline-fonttools/bin/python" -m pip install fonttools==4.66.1
          echo "FONTTOOLS_PYTHON=$RUNNER_TEMP/design-pipeline-fonttools/bin/python" >> "$GITHUB_ENV"

      - name: Prepare browser runtimes
        run: |
          npm exec -- playwright install-deps chromium
          npm run browser:install

      - name: Allow Chrome's sandbox
        # Ubuntu 23.10+ runners restrict unprivileged user namespaces through AppArmor, so the headless
        # Chrome the browser tests launch exits with "No usable sandbox!". Lift that restriction here
        # instead of turning the sandbox off in the tests.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Validate specifications
        run: npm run specs:check

      - name: Hermetic QA
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/qa.log"

      - name: Annotate QA failures
        # Puts each failed QA line and failing test (with the start of its error) on the PR as an
        # annotation, so a failure is readable without downloading the job log.
        if: failure()
        shell: bash
        run: |
          grep -E '^FAIL ' "$RUNNER_TEMP/qa.log" | head -20 | while IFS= read -r line; do echo "::error title=QA::$line"; done
          awk '/^[[:space:]]*not ok /{if(n>0) print block; block=$0; n=25; next} n>0{block=block "%0A" $0; n--; if(n==0){print block}} END{if(n>0) print block}' "$RUNNER_TEMP/qa.log" | head -10 | while IFS= read -r block; do echo "::error title=Failing test::$block"; done

      - name: Package
        run: npm run package:skill -- --output-root dist

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: design-pipeline-skill
          path: |
            dist/design-pipeline-skill.tgz
            dist/design-pipeline-skill.zip
            dist/checksums.txt
          if-no-files-found: error
