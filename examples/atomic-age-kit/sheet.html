<body>
<main class="sheet">
  <header class="sheet-head">
    <h1 class="display">PRINT SET <span>No. 1</span></h1>
    <p class="tracked">Ten templates · one palette<br><span class="mono">atomic-age · Halcyon Orbital Lines</span></p>
  </header>
  <section class="grid">
    <figure class="w4"><img src="renders/cover.atomic-magazine.jpg" alt="Magazine cover: orbitville Gazette, June 1975, with a duotone of a NASA torus-colony painting"><figcaption><b>cover.atomic-magazine</b>Masthead in two inks, contents column, sun disc and orbit; art: NASA Ames torus colony (Rick Guidice, 1975), duotone with a misregistered teal plate.</figcaption></figure>
    <figure class="w4"><img src="renders/poster.atomic-travel.jpg" alt="Travel poster: Earthrise, Apollo 17, December 1972"><figcaption><b>poster.atomic-travel</b>Slanted condensed title, vermilion band; art: Apollo 17 Earthrise (AS17-152-23272, 1972), duotone. Emblem slot left empty.</figcaption></figure>
    <figure class="w4"><img src="renders/cover.atomic-linen-book.jpg" alt="Linen book cover: Orbital Trajectory Tables"><figcaption><b>cover.atomic-linen-book</b>Charcoal cloth, a loop round the title with the rocket glyph cut out of it.</figcaption></figure>
    <figure class="w7"><img src="renders/banner.atomic-ad-panel.jpg" alt="Ad panel: 1959 Meridian 88 owner portfolio"><figcaption><b>banner.atomic-ad-panel</b>Vermilion lens with a misregistered mustard plate, swept rocket glyph, tracked wordmark. Brand and logo are user-filled.</figcaption></figure>
    <figure class="w5"><img src="renders/card.atomic-field-label.jpg" alt="Field guide label card"><figcaption><b>card.atomic-field-label</b>On a printed mustard board (materials generate --generator print).</figcaption></figure>
    <figure class="w6"><div class="compare"><img src="renders/doc.atomic-flight-plan.jpg" alt="Flight plan template set as the Apollo 11 landing timeline"><img src="art/nasa-a11-flight-plan-p141.jpg" alt="Apollo 11 Final Flight Plan, page 141 (NASA, 1969)"></div><figcaption><b>doc.atomic-flight-plan</b>Left: the template, set as the Apollo 11 landing hours (historical fact as text, unsigned notes). Right: Apollo 11 Final Flight Plan, July 1, 1969, page 141, for comparison.</figcaption></figure>
    <figure class="w6"><div class="compare"><img src="renders/doc.atomic-checklist.jpg" alt="Checklist template with a NASA Gemini diagram"><img src="art/nasa-a11-flight-plan-p160.jpg" alt="Apollo 11 Final Flight Plan, page 160: lunar orbit rest period attitude (NASA, 1969)"></div><figcaption><b>doc.atomic-checklist</b>Left: the template with a NASA Gemini line diagram (S64-04925, 1964), photocopied. Right: Apollo 11 Final Flight Plan, page 160.</figcaption></figure>
    <figure class="w4"><img src="renders/poster.atomic-solar-print.jpg" alt="Solar system print on a printed vermilion flat"><figcaption><b>poster.atomic-solar-print</b>Printed vermilion flat with a misregistered mustard plate.</figcaption></figure>
    <figure class="w4"><img src="renders/poster.atomic-orbit-plate.jpg" alt="White-line orbital plate on black"><figcaption><b>poster.atomic-orbit-plate</b>White lines on black, chalk labels, a typed formula.</figcaption></figure>
    <figure class="w4"><img src="renders/card.atomic-credential.jpg" alt="Press credential for Apollo 11"><figcaption><b>card.atomic-credential</b>Programme name as text on aged card; the emblem slot stays empty for the owner's file.</figcaption></figure>
  </section>
