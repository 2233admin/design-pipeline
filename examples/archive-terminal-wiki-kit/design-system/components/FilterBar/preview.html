<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Filter bar</title></head>
<body class="at-page">
<section class="at-demo" data-theme="light"><p class="at-demo__label">striped filter panel with toggle chips (selected, hover forced, disabled) · light</p>
<section class="at-filters"><div class="at-filters__head"><div><p class="at-filters__code">// arms index</p><h3 class="at-filters__title">武装情报</h3></div><div class="at-filters__tools"><button class="at-btn at-btn--tool" type="button"><svg class="at-icon at-icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg>重置</button></div></div><div class="at-filters__row"><span class="at-filters__label">稀有度</span><div class="at-filters__opts"><button class="at-toggle" type="button" aria-pressed="true">全部</button><button class="at-toggle is-hover" type="button" aria-pressed="false">6★</button><button class="at-toggle" type="button" aria-pressed="false">5★</button><button class="at-toggle" type="button" aria-pressed="false" disabled>2★</button></div></div><div class="at-filters__row"><span class="at-filters__label">类型</span><div class="at-filters__opts"><button class="at-toggle" type="button" aria-pressed="false">全部</button><button class="at-toggle" type="button" aria-pressed="false">长柄</button><button class="at-toggle" type="button" aria-pressed="true">单刃</button><button class="at-toggle" type="button" aria-pressed="false">射装</button><button class="at-toggle" type="button" aria-pressed="false">法匣</button></div></div></section>
</section>
<section class="at-demo" data-theme="dark"><p class="at-demo__label">striped filter panel with toggle chips (selected, hover forced, disabled) · dark</p>
<section class="at-filters"><div class="at-filters__head"><div><p class="at-filters__code">// arms index</p><h3 class="at-filters__title">武装情报</h3></div><div class="at-filters__tools"><button class="at-btn at-btn--tool" type="button"><svg class="at-icon at-icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg>重置</button></div></div><div class="at-filters__row"><span class="at-filters__label">稀有度</span><div class="at-filters__opts"><button class="at-toggle" type="button" aria-pressed="true">全部</button><button class="at-toggle is-hover" type="button" aria-pressed="false">6★</button><button class="at-toggle" type="button" aria-pressed="false">5★</button><button class="at-toggle" type="button" aria-pressed="false" disabled>2★</button></div></div><div class="at-filters__row"><span class="at-filters__label">类型</span><div class="at-filters__opts"><button class="at-toggle" type="button" aria-pressed="false">全部</button><button class="at-toggle" type="button" aria-pressed="false">长柄</button><button class="at-toggle" type="button" aria-pressed="true">单刃</button><button class="at-toggle" type="button" aria-pressed="false">射装</button><button class="at-toggle" type="button" aria-pressed="false">法匣</button></div></div></section>
</section>
