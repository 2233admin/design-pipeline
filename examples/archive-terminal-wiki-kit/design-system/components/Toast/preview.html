<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Toast and loading</title></head>
<body class="at-page">
<section class="at-demo" data-theme="light"><p class="at-demo__label">loading guide, success, error; skeleton lines · light</p>
<ul class="at-toasts at-toasts--static"><li class="at-toast" role="status"><span class="at-toast__sweep" aria-hidden="true"></span><span class="at-toast__msg">正在载入引导…</span><button class="at-toast__btn" type="button" data-toast-close>关闭</button></li><li class="at-toast at-toast--ok" role="status"><span class="at-toast__msg">链接已复制</span><button class="at-toast__btn" type="button" data-toast-close>关闭</button></li><li class="at-toast at-toast--error" role="alert"><span class="at-toast__msg">同步失败，稍后重试</span><button class="at-toast__btn" type="button" data-toast-close>关闭</button></li></ul><div style="margin-top: var(--space-4); max-width: 360px"><div class="at-skel at-skel--line" style="width: 70%"></div><div class="at-skel at-skel--line"></div><div class="at-skel at-skel--line" style="width: 45%"></div></div>
</section>
<section class="at-demo" data-theme="dark"><p class="at-demo__label">loading guide, success, error; skeleton lines · dark</p>
<ul class="at-toasts at-toasts--static"><li class="at-toast" role="status"><span class="at-toast__sweep" aria-hidden="true"></span><span class="at-toast__msg">正在载入引导…</span><button class="at-toast__btn" type="button" data-toast-close>关闭</button></li><li class="at-toast at-toast--ok" role="status"><span class="at-toast__msg">链接已复制</span><button class="at-toast__btn" type="button" data-toast-close>关闭</button></li><li class="at-toast at-toast--error" role="alert"><span class="at-toast__msg">同步失败，稍后重试</span><button class="at-toast__btn" type="button" data-toast-close>关闭</button></li></ul><div style="margin-top: var(--space-4); max-width: 360px"><div class="at-skel at-skel--line" style="width: 70%"></div><div class="at-skel at-skel--line"></div><div class="at-skel at-skel--line" style="width: 45%"></div></div>
</section>
</body>
</html>
