<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Top bar</title></head>
<body class="at-page">
<section class="at-demo" data-theme="light"><p class="at-demo__label">top bar with search, icon actions and login · light</p>
<header class="at-topbar">
<div class="at-strip" aria-hidden="true"></div>
<div class="at-topbar__row">
  <button class="at-iconbtn at-topbar__menu" type="button" aria-label="打开导航" aria-expanded="false" aria-controls="sidenav" data-drawer-open><svg class="at-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
  <a class="at-brand" href="home.html"><svg class="at-brand__mark" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 14 20 7l14 7v14l-14 7-14-7z"/><path d="M6 14l14 7 14-7"/><path d="M20 21v14"/><path d="M11 11.5 25 18.5" stroke-width="1.2"/><path d="M24 26.5l5-2.5M24 30l5-2.5" stroke-width="1.2"/></svg><span class="at-brand__name">霜线档案</span><span class="at-brand__tag at-hide-sm">Alpha</span></a>
  <div class="at-topbar__search"><form class="at-search" role="search" action="search.html" data-search>
  <input class="at-search__input" id="q-demo" name="q" type="search" autocomplete="off" aria-label="搜索条目" placeholder="搜索调查员、武装、物资…" value="" aria-keyshortcuts="/ Control+K Meta+K" aria-controls="q-list" aria-autocomplete="list" aria-expanded="false">
  <span class="at-search__keys at-hide-sm" aria-hidden="true"><kbd class="at-kbd">/</kbd><kbd class="at-kbd">⌘K</kbd></span>
  <button class="at-search__go" type="submit" aria-label="搜索"><svg class="at-icon at-icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg></button>
  <ul class="at-suggest" id="q-list" role="listbox" aria-label="搜索建议" hidden></ul>
</form></div>
  <div class="at-topbar__actions">
    <a class="at-iconbtn" href="search.html" aria-label="搜索" data-sm-only><svg class="at-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg></a>
    <button class="at-iconbtn at-hide-sm" type="button" aria-label="主题：跟随系统，点击切换" data-theme-toggle><svg class="at-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="12"/><path d="M8 20h8M12 16v4"/></svg></button>
    <button class="at-iconbtn at-iconbtn--accent" type="button" aria-label="版本公告（有更新）" aria-haspopup="dialog" data-notice-open><svg class="at-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 10v4h3l7 4V6L7 10z"/><path d="M17.5 9a4 4 0 0 1 0 6"/></svg><span class="at-iconbtn__dot" aria-hidden="true"></span></button>
    <a class="at-iconbtn at-hide-sm" href="entity.html" aria-label="随机条目"><svg class="at-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 7h3c4 0 6 10 10 10h3"/><path d="M4 17h3c1.6 0 2.8-1.4 3.8-3"/><path d="M13.2 10C14.2 8.4 15.4 7 17 7h3"/><path d="m17 4 3 3-3 3"/><path d="m17 14 3 3-3 3"/></svg></a>
    <a class="at-iconbtn at-hide-sm" href="article.html" aria-label="帮助"><svg class="at-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7"/><path d="M12 17h.01"/></svg></a>
    <a class="at-btn at-btn--accent at-hide-sm" href="#" style="--chamfer: var(--chamfer-sm)"><svg class="at-icon at-icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>登录</a>
  </div>
</div>
</header>
</section>
