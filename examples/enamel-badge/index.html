<header><div><div class="version">ENAMEL STUDY / 01</div><h1>珐琅徽章</h1><p>制作：当前会话 Codex · 精确模型 ID 未向运行环境暴露</p></div><div class="tag">原徽章 · 可交互样件</div></header>
<main>
 <div class="viewer" id="stage" aria-label="珐琅徽章三维展示，可拖动转向">
  <div class="scene-caption"><b id="view-label">ASSEMBLED / 合拢正面</b><span>OBJECT-LOCKED SURFACE · 5 LAYERS</span></div>
  <canvas tabindex="0" id="badge" aria-label="有银色边框、蓝色釉面和青紫虹彩嵌片的六边形徽章"></canvas>
  <div class="scene-hint">拖动看反光 · 材质纹理固定在物体上</div>
  <div class="error" id="error" role="alert" hidden></div>
 </div>
 <aside class="controls">
  <section><h2>查看结构</h2><div class="buttons"><button id="front" aria-pressed="true">正面</button><button id="oblique" aria-pressed="false">侧转</button><button id="layers" aria-pressed="false">拆层</button></div></section>
  <section>
   <div class="control"><label for="explode">分层距离 <output id="explode-value">0%</output></label><input id="explode" type="range" min="0" max="1" step=".01" value="0"></div>

   <div class="control" id="time-control"><label for="time">时间 <output id="time-value">0.00s</output></label><input id="time" type="range" min="0" max="31.158333" step=".01" value="0"></div>
  </section>
  <section><h2>三种材质，分别着色</h2><div class="legend"><div><i class="swatch blue"></i>蓝釉 · 起伏、清漆反光</div><div><i class="swatch silver"></i>银色金属 · 实体厚度与倒角</div><div><i class="swatch foil"></i>虹彩嵌片 · 六向刻纹、薄膜与光谱变色</div></div><div class="buttons" style="margin-top:18px"><button id="material" aria-pressed="true">材质：开启</button></div></section>
