<!doctype html>

<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dialog</title></head>
<body class="ms-page">
<section class="ms-demo"><p class="ms-demo__label">reserve dialog drawn open: HUD frame, field, radio group, actions</p>
<dialog class="ms-dialog" style="position: static; margin: 0" id="pv-dlg" aria-labelledby="pv-dlg-h" open><div class="ms-hudframe"><span class="ms-hudframe__c ms-hudframe__c--tl" aria-hidden="true"></span><span class="ms-hudframe__c ms-hudframe__c--tr" aria-hidden="true"></span><span class="ms-hudframe__c ms-hudframe__c--bl" aria-hidden="true"></span><span class="ms-hudframe__c ms-hudframe__c--br" aria-hidden="true"></span><span class="ms-hudframe__label data-sm">FORM 01</span><form method="dialog" class="ms-dialog__form"><header class="ms-dialog__head"><h2 class="title-block" id="pv-dlg-h">预约下潜</h2><p class="caps">RESERVE A DESCENT</p><button class="ms-iconbtn ms-dialog__close" value="cancel" aria-label="关闭"><svg class="ms-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header><div class="ms-field"><label class="ms-field__label" for="pv-dlg-call"><span class="ms-bi"><span class="ms-bi__zh">呼号</span><span class="ms-bi__en caps">CALL SIGN</span></span></label><input class="ms-field__input data-sm" id="pv-dlg-call" name="pv-dlg-call" type="text" autocomplete="off" value="" placeholder="S-00" aria-describedby="pv-dlg-call-hint"><p class="ms-field__hint body-sm" id="pv-dlg-call-hint">只收大写字母、数字和连字符。</p></div><fieldset class="ms-radios"><legend class="ms-radios__legend"><span class="ms-bi"><span class="ms-bi__zh">平台</span><span class="ms-bi__en caps">PLATFORM</span></span></legend><label class="ms-radio"><input type="radio" name="pv-dlg-plat" value="0" checked><span class="ms-radio__mark" aria-hidden="true"></span><span class="data-sm">WINDOWS</span></label><label class="ms-radio"><input type="radio" name="pv-dlg-plat" value="1"><span class="ms-radio__mark" aria-hidden="true"></span><span class="data-sm">CONSOLE</span></label><label class="ms-radio"><input type="radio" name="pv-dlg-plat" value="2"><span class=
