<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Report index</title></head>
<body class="cc-page">
<section class="cc-demo"><p class="cc-demo__label">title cards as a grid; the current one on paper; hover (forced) on the third</p>
<ul class="cc-rgrid"><li><button class="cc-rcard is-current" type="button" data-report="0" aria-haspopup="dialog"><span class="cc-card cc-card--paper cc-card--mini">
  <span class="cc-card__num">第壹报</span>
  <span class="cc-card__title"><span class="cc-card__l1">水</span><span class="cc-card__l2">位<span class="cc-card__comma">、</span>越线</span></span>
</span><span class="cc-rcard__meta">第壹报 · 水位、越线</span></button></li><li><button class="cc-rcard" type="button" data-report="1" aria-haspopup="dialog"><span class="cc-card cc-card--black cc-card--mini">
  <span class="cc-card__num">第弍报</span>
  <span class="cc-card__title"><span class="cc-card__l1">闸</span><span class="cc-card__l2">门<span class="cc-card__comma">、</span>不开</span></span>
</span><span class="cc-rcard__meta">第弍报 · 闸门、不开</span></button></li><li><button class="cc-rcard is-hover" type="button" data-report="2" aria-haspopup="dialog"><span class="cc-card cc-card--black cc-card--mini">
  <span class="cc-card__num">第叁报</span>
  <span class="cc-card__title"><span class="cc-card__l1">夜</span><span class="cc-card__l2">班<span class="cc-card__comma">、</span>无人</span></span>
</span><span class="cc-rcard__meta">第叁报 · 夜班、无人</span></button></li><li><button class="cc-rcard" type="button" data-report="3" aria-haspopup="dialog"><span class="cc-card cc-card--black cc-card--mini">
  <span class="cc-card__num">第肆报</span>
  <span class="cc-card__title"><span class="cc-card__l1">涌</span><span class="cc-card__l2">体<span class="cc-card__comma">、</span>上浮</span></span>
</span><span class="cc-rcard__meta">第肆报 · 涌体、上浮</span></button></li><li><button class="cc-rcard" type="button" data-report="4" aria-haspopup="dialog"><span class="cc-card cc-card--black cc-card--mini">
  <span class="cc-card__num">第伍报</span>
  <span class="cc-card__title"><span class="cc-card__l1">蓄</span><span class="cc-card__l2">压<span class="cc-card__comma">、</span>见底</span></span>
</span><span class="cc-rcard__meta">第伍报 · 蓄压、见底</span></button></li><li><button class="cc-rcard" type="button" data-report="5" aria-haspopup="dialog"><span class="cc-card cc-card--black cc-card--mini">
  <span class="cc-card__num">第陆报</span>
  <span class="cc-card__title"><span class="cc-card__l1">五</span><span class="cc-card__l2">席<span class="cc-card__comma">、</span>分歧</span></span>
</span><span class="cc-rcard__meta">第陆报 · 五席、分歧</span></button></li></ul>
</section>
</body>
</html>
