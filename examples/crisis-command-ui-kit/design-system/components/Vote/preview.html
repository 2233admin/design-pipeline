<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Five-seat vote</title></head>
<body class="cc-page">
<section class="cc-demo"><p class="cc-demo__label">result with one dissent; hover (forced) on seat 2</p>
<div style="width: 1100px"><section class="cc-vote " id="v1" aria-labelledby="v1-h"><div class="cc-vote__head"><h3 class="cc-vote__title" id="v1-h">五席表决</h3><p class="cc-vote__result" aria-live="polite">可决 4 · 否决 1</p></div><ol class="cc-vote__seats"><li><button class="cc-seat" type="button" aria-describedby="v1-why-0"><span class="cc-seat__en">SEAT 1</span><span class="cc-seat__v">可</span></button><span class="cc-seat__why" id="v1-why-0">席一 · 泵站余量足够</span></li><li><button class="cc-seat is-hover" type="button" aria-describedby="v1-why-1"><span class="cc-seat__en">SEAT 2</span><span class="cc-seat__v">可</span></button><span class="cc-seat__why" id="v1-why-1">席二 · 下游无居民区</span></li><li><button class="cc-seat" type="button" aria-describedby="v1-why-2"><span class="cc-seat__en">SEAT 3</span><span class="cc-seat__v">可</span></button><span class="cc-seat__why" id="v1-why-2">席三 · 水位仍在上涨</span></li><li><button class="cc-seat" type="button" aria-describedby="v1-why-3"><span class="cc-seat__en">SEAT 4</span><span class="cc-seat__v">可</span></button><span class="cc-seat__why" id="v1-why-3">席四 · 规程允许例外</span></li><li><button class="cc-seat is-no" type="button" aria-describedby="v1-why-4"><span class="cc-seat__en">SEAT 5</span><span class="cc-seat__v">否</span></button><span class="cc-seat__why" id="v1-why-4">席五 · 声呐有未识别回波</span></li></ol></section></div>
</section>
<section class="cc-demo"><p class="cc-demo__label">voting (loading)</p>
<div style="width: 1100px"><section class="cc-vote  is-pending" id="v2" aria-labelledby="v2-h"><div class="cc-vote__head"><h3 class="cc-vote__title" id="v2-h">五席表决</h3><p class="cc-vote__result" aria-live="polite">表决中 · VOTING</p></div><ol class="cc-vote__seats"><li><button class="cc-seat" type="button" aria-describedby="v2-why-0" aria-busy="true"><span class="cc-seat__en">SEAT 1</span><span class="cc-seat__v"></span></button><span class="cc-seat__why" id="v2-why-0">席一 · 泵站余量足够</span></li><li><button class="cc-seat" type="button" aria-describedby="v2-why-1" aria-busy="true"><span class="cc-seat__en">SEAT 2</span><span class="cc-seat__v"></span></button><span class="cc-seat__why" id="v2-why-1">席二 · 下游无居民区</span></li><li><button class="cc-seat" type="button" aria-describedby="v2-why-2" aria-busy="true"><span class="cc-seat__en">SEAT 3</span><span class="cc-seat__v"></span></button><span class="cc-seat__why" id="v2-why-2">席三 · 水位仍在上涨</span></li><li><button class="cc-seat" type="button" aria-describedby="v2-why-3" aria-busy="true"><span class="cc-seat__en">SEAT 4</span><span class="cc-seat__v"></span></button><span class="cc-seat__why" id="v2-why-3">席四 · 规程允许例外</span></li><li><button class="cc-seat is-no" type="button" aria-describedby="v2-why-4" aria-busy="true"><span class="cc-seat__en">SEAT 5</span><span class="cc-seat__v"></span></button><span class="cc-seat__why" id="v2-why-4">席五 · 声呐有未识别回波</span></li></ol></section></div>
</section>
</body>
</html>
