<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hexagon panel</title></head>
<body class="cc-page">
<section class="cc-demo"><p class="cc-demo__label">main panel: stamps, compressed Mincho, English</p>
<div style="width: 1100px"><div class="cc-hex cc-hex--main cc-alertmain" ><div class="cc-hex__body"><span class="cc-stamp ">警报</span><div class="cc-alertmain__copy"><p class="cc-alertmain__zh"><span>第九排涝区</span><span>转入防潮战备</span></p><p class="cc-alertmain__en">TRANSFER OF DRAINAGE ZONE 9<br>TO FLOOD COMBAT READINESS</p></div><span class="cc-stamp ">警报</span></div></div></div>
</section>
<section class="cc-demo"><p class="cc-demo__label">side and lower panels; interactive: rest, hover (forced), idle, disabled</p>
<div class="cc-demo__row"><div style="width: 460px"><div class="cc-hex cc-hex--side cc-warn" ><div class="cc-hex__body"><span class="cc-warn__tri" aria-hidden="true"></span><span class="cc-warn__lvl">LEVEL 3</span><span class="cc-warn__word">WARNING</span></div></div></div><div style="width: 460px"><div class="cc-hex cc-hex--low cc-seathex" ><div class="cc-hex__body"><span class="cc-modebox">MODE: CONTAIN</span><span class="cc-seathex__zh">表决席一</span><span class="cc-seathex__en">QUINTET 1</span></div></div></div></div>
</section>
<section class="cc-demo"><p class="cc-demo__label"></p>
<div class="cc-demo__row"><div style="width: 300px"><button class="cc-hex cc-hex--low" type="button" style="--h: 120px"><span class="cc-hex__body"><span class="cc-seathex__zh">东缘十二号闸</span></span></button></div><div style="width: 300px"><button class="cc-hex cc-hex--low cc-hex--idle" type="button" style="--h: 120px"><span class="cc-hex__body"><span class="cc-seathex__zh">南堤三号闸</span></span></button></div><div style="width: 300px"><button class="cc-hex cc-hex--low" type="button" style="--h: 120px" disabled><span class="cc-hex__body"><span class="cc-seathex__zh">南堤九号闸 检修</span></span></button></div></div>
</section>
</body>
</html>
