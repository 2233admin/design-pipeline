<!-- @dsCard group="Type cards" height=1180 -->
<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Title card</title></head>
<body class="cc-page">
<section class="cc-demo"><p class="cc-demo__label">black card: number at half size, one glyph, then the rest after a half-pitch comma</p>
<div style="--card-h: 420px; width: 560px"><div style="--card-h: 420px" class="cc-card cc-card--black ">
  <p class="cc-card__num">第壹报</p>
  <p class="cc-card__title"><span class="cc-card__l1">水</span><span class="cc-card__l2">位<span class="cc-card__comma">、</span>越线</span></p>
</div></div>
</section>
<section class="cc-demo"><p class="cc-demo__label">paper and red cards, and the vertical number column</p>
<div class="cc-demo__row"><div style="--card-h: 240px; width: 320px" class="cc-card cc-card--paper ">
  <p class="cc-card__num">第弍报</p>
  <p class="cc-card__title"><span class="cc-card__l1">闸</span><span class="cc-card__l2">门<span class="cc-card__comma">、</span>不开</span></p>
</div><div style="--card-h: 240px; width: 320px" class="cc-card cc-card--red ">
  <p class="cc-card__num">第肆报</p>
  <p class="cc-card__title"><span class="cc-card__l1">涌</span><span class="cc-card__l2">体<span class="cc-card__comma">、</span>上浮</span></p>
</div><div style="--card-h: 240px; width: 320px" class="cc-card cc-card--black cc-card--column">
  <p class="cc-card__num">第玖报</p>
  <p class="cc-card__title"><span class="cc-card__l1">耦</span><span class="cc-card__l2">合<span class="cc-card__comma">、</span>越限</span></p>
</div></div>
</section>
</body>
</html>
